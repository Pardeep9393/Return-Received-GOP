<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Summary Dashboard</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#111827; --accent:#3b82f6; --accent2:#22c55e;
    --danger:#ef4444; --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:var(--card2);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  header h1{font-size:20px;margin:0;}
  header a{color:var(--accent);font-size:13px;text-decoration:none;}
  header a:hover{text-decoration:underline;}
  .container{max-width:1100px;margin:0 auto;padding:24px 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;}
  .card h2{margin-top:0;font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  select, input[type=date]{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:14px;
  }
  select:focus, input[type=date]:focus{outline:2px solid var(--accent);}
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;}
  .filters > div{flex:1;min-width:160px;}
  .btn{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2563eb;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--accent);}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .stat .value{font-size:26px;font-weight:700;color:var(--accent);margin-top:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:800px){.grid2{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th, td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--card);}
  .table-wrap{max-height:360px;overflow-y:auto;}
  .empty-note{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;}
</style>
</head>
<body>

<header>
  <h1>📊 Scan Summary Dashboard</h1>
  <a href="index.html">← Back to Scan Entry</a>
</header>

<div class="container">

  <div class="card">
    <h2>Filters</h2>
    <div class="filters">
      <div>
        <label for="dateFrom">Date From</label>
        <input type="date" id="dateFrom">
      </div>
      <div>
        <label for="dateTo">Date To</label>
        <input type="date" id="dateTo">
      </div>
      <div>
        <label for="clientFilter">Client</label>
        <select id="clientFilter"><option value="">All Clients</option></select>
      </div>
      <div style="flex:0;">
        <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
      </div>
      <div style="flex:0;">
        <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
      </div>
      <div style="flex:0;">
        <button class="btn btn-outline" onclick="loadScans()">🔄 Refresh</button>
      </div>
    </div>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="grid2">
    <div class="card">
      <h2>Date-wise Scan Data</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Total AWB</th></tr></thead>
          <tbody id="dateBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Client-wise Scan Data</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Client</th><th>Total AWB</th></tr></thead>
          <tbody id="clientBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Courier-wise Scan Data</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Courier</th><th>Total AWB</th></tr></thead>
        <tbody id="courierBody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer-note">Scan Summary Dashboard · Emiza</div>
</div>

<script>
/* ============================================================
   CONFIG — same backend as the Scan Entry dashboard
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbyBPaTIc0uldPFGAS_TRLZzsKSW3bUkXHsPR8aaRFaArCZPe13mtncmqhbfq_-gHmih/exec";

let allRows = [];   // every scan row from the backend, unfiltered
let filteredRows = []; // rows after date/client filter applied

window.onload = function () {
  loadScans();
};

/* ============================================================
   LOAD ALL SCAN ROWS FROM BACKEND
   ============================================================ */
async function loadScans() {
  if (!API_URL || API_URL.indexOf("PASTE_YOUR") !== -1) {
    document.getElementById("statRow").innerHTML =
      '<div class="empty-note">Backend not configured yet.</div>';
    return;
  }
  try {
    const res = await fetch(API_URL + "?action=getScans");
    const data = await res.json();
    allRows = (data && data.rows) || [];
    populateClientFilter();
    filteredRows = allRows.slice();
    render();
  } catch (e) {
    console.error(e);
    document.getElementById("statRow").innerHTML =
      '<div class="empty-note">⚠️ Could not load scan data — check connection.</div>';
  }
}

function populateClientFilter() {
  const sel = document.getElementById("clientFilter");
  const current = sel.value;
  const clients = Array.from(new Set(allRows.map(r => r.client))).sort();
  sel.innerHTML = '<option value="">All Clients</option>' +
    clients.map(c => `<option value="${c}">${c}</option>`).join("");
  sel.value = current;
}

/* ============================================================
   FILTERS
   ============================================================ */
function rowDateOnly(r) {
  // scanDate may be an ISO string (from sheet) or a locale string
  // (e.g. "31/08/2026, 2:59:20 pm") saved directly from the scan
  // screen. Normalize to YYYY-MM-DD for comparison.
  const d = new Date(r.scanDate);
  if (isNaN(d)) return "";
  return d.toISOString().slice(0, 10);
}

function applyFilters() {
  const from = document.getElementById("dateFrom").value;
  const to = document.getElementById("dateTo").value;
  const client = document.getElementById("clientFilter").value;

  filteredRows = allRows.filter(r => {
    if (client && r.client !== client) return false;
    if (from || to) {
      const d = rowDateOnly(r);
      if (!d) return false;
      if (from && d < from) return false;
      if (to && d > to) return false;
    }
    return true;
  });
  render();
}

function resetFilters() {
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  document.getElementById("clientFilter").value = "";
  filteredRows = allRows.slice();
  render();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  renderStats();
  renderDateWise();
  renderClientWise();
  renderCourierWise();
}

function renderStats() {
  const total = filteredRows.length;
  const clients = new Set(filteredRows.map(r => r.client)).size;
  const couriers = new Set(filteredRows.map(r => r.courier)).size;
  const dates = new Set(filteredRows.map(rowDateOnly).filter(Boolean)).size;

  document.getElementById("statRow").innerHTML = `
    <div class="stat"><div class="label">Total AWB</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">Clients</div><div class="value">${clients}</div></div>
    <div class="stat"><div class="label">Couriers</div><div class="value">${couriers}</div></div>
    <div class="stat"><div class="label">Days Covered</div><div class="value">${dates}</div></div>
  `;
}

function groupCount(rows, keyFn) {
  const map = {};
  rows.forEach(r => {
    const key = keyFn(r);
    if (!key) return;
    map[key] = (map[key] || 0) + 1;
  });
  return map;
}

function fillTable(bodyId, map, sortDesc) {
  const body = document.getElementById(bodyId);
  body.innerHTML = "";
  const keys = Object.keys(map).sort((a, b) => sortDesc ? b.localeCompare(a) : a.localeCompare(b));
  if (!keys.length) {
    body.innerHTML = '<tr><td colspan="2" class="empty-note">No data for selected filters</td></tr>';
    return;
  }
  keys.forEach(k => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${k}</td><td>${map[k]}</td>`;
    body.appendChild(tr);
  });
}

function renderDateWise() {
  const map = groupCount(filteredRows, r => rowDateOnly(r));
  fillTable("dateBody", map, true);
}

function renderClientWise() {
  const map = groupCount(filteredRows, r => r.client);
  fillTable("clientBody", map, false);
}

function renderCourierWise() {
  const map = groupCount(filteredRows, r => r.courier);
  fillTable("courierBody", map, false);
}
</script>
</body>
</html>
